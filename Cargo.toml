# SPDX-License-Identifier: MPL-2.0
#
# Single Cargo workspace for the Rust core, the media server and Rust tools.
# Hot-file rules: docs/ROADMAP.md §0.5.
#
# Members are globs, so adding a crate under `core/crates/` or `tools/crates/`
# does not touch this file. Cargo cannot glob directories without a
# `Cargo.toml`, so non-Rust tools stay outside `tools/crates/`, and the
# `.gitkeep` files keep the globs non-empty while there are no crates yet.

[workspace]
resolver = "3"
members = [
    "core/crates/*",
    "server",
    "tools/crates/*",
    "tools/recognition-eval",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MPL-2.0"
repository = "https://github.com/DenisHumen/project_alpha"
publish = false

# One line per dependency, sorted alphabetically. Crates use `dep.workspace = true`.
[workspace.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
axum = { version = "0.8.9", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
dirs = "7.0"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize"] }
flutter_rust_bridge = "=2.13.0"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
getrandom = "0.4"
hkdf = "0.13"
httpdate = "1.0.3"
keyring-core = { version = "1.0.1", default-features = false }
lofty = "0.25.5"
md-5 = "0.11"
mdns-sd = { version = "0.21.7", default-features = false }
proptest = "1.12"
quick-xml = "0.42"
rcgen = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.42", features = ["bundled"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
tempfile = "3.27"
thiserror = "2.0.21"
tokio-rustls = { version = "0.26", default-features = false }
tokio = { version = "1.54", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
uniffi = { version = "0.32.2", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
uuid = { version = "1.29", default-features = false, features = ["std", "v7"] }
windows-native-keyring-store = { version = "1.1", default-features = false }
x25519-dalek = { version = "3.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
zeroize = "1.9"
