# Samba for the pa-vfs contract suite (NET-003, CI-012). Read-only shares
# over the seeded data directory; only the throwaway user may log on.
# start.sh appends `server signing = mandatory` for the "signed" instance.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   passdb backend = tdbsam
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2_02
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix charset = UTF-8
   log level = 1

# Plain share; encryption only if the client asks for it.
[media]
   path = /data
   read only = yes
   valid users = kinolune

# Share that mandates SMB3 encryption.
[sealed]
   path = /data
   read only = yes
   valid users = kinolune
   smb encrypt = required
