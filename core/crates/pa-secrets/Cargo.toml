# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-secrets"
version = "0.1.0"
description = "Secret storage of project_alpha: OS keychains, platform callbacks, encrypted-file fallback, log redaction"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# Desktop OS keychains: keyring-core plus one store crate per OS.
# Android, iOS and tvOS use the platform callback (`PlatformKeystore`) instead.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "macos", windows))'.dependencies]
keyring-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
