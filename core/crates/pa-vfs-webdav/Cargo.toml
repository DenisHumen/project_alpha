# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-vfs-webdav"
version = "0.1.0"
description = "WebDAV backend of pa-vfs: PROPFIND listing, Range reads with read-ahead, Basic and Digest auth, redirects, TLS pinning (NET-004)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Contract tests against real servers in Docker (tests/servers/README.md).
# Off by default: they need the containers to be running.
server-tests = []

[dependencies]
getrandom.workspace = true
httpdate.workspace = true
md-5.workspace = true
# Fingerprint format and pinned-certificate verifier shared with our server
# (SRV-004); only `tls`, without the mDNS browser.
pa-discovery = { path = "../pa-discovery", default-features = false, features = ["tls"] }
pa-vfs = { path = "../pa-vfs" }
quick-xml.workspace = true
# Blocking client (ADR-0013: pa-vfs is synchronous); rustls with the ring
# provider, no OpenSSL and no aws-lc (deny.toml).
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
sha2.workspace = true

[dev-dependencies]
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
tempfile.workspace = true
