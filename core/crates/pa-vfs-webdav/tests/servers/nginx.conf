# nginx WebDAV for the contract suite: /dav/ → /data, read-only, Basic auth.
load_module /usr/lib/nginx/modules/ngx_http_dav_ext_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {}

http {
    access_log off;
    client_body_temp_path /tmp;

    server {
        listen 8080;

        location /dav/ {
            alias /data/;
            dav_ext_methods PROPFIND OPTIONS;
            auth_basic "kinolune";
            auth_basic_user_file /auth/htpasswd;
        }
    }
}
