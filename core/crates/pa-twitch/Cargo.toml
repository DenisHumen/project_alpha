# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-twitch"
version = "0.1.0"
description = "Twitch Helix API client (TWI-001), Device Code Flow sign-in (TWI-002) and playback decision with native GQL/usher HLS in full builds (TWI-004)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["reqwest"]
# Real HTTPS transport: reqwest + rustls with the ring provider (no OpenSSL,
# no aws-lc). Without it the crate is transport-agnostic and the app injects
# its own `Transport`.
reqwest = ["dep:reqwest", "dep:rustls"]
# Fixture transport and manual clock for tests of this and dependent crates.
testing = []
# No flavor feature here: native playback through GQL + usher (TWI-004) is
# the `twitch-native` capability of pa-flavor (CORE-013), compiled under
# `cfg(pa_twitch_native)`. Full build of this crate alone:
# `cargo test -p pa-twitch --features pa-flavor/full`.

[dependencies]
pa-flavor = { path = "../pa-flavor" }
pa-remote-config = { path = "../pa-remote-config", default-features = false }
pa-secrets = { path = "../pa-secrets" }
reqwest = { workspace = true, optional = true, features = ["http2", "rustls-no-provider"] }
rustls = { workspace = true, optional = true, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[build-dependencies]
pa-flavor = { path = "../pa-flavor" }

[dev-dependencies]
pa-twitch = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
# Store/full artifact check (CORE-013, tools/flavor/check-artifacts.sh).
name = "flavor_probe"
required-features = ["reqwest"]
