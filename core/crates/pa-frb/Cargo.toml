# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-frb"
version = "0.1.0"
description = "flutter_rust_bridge facade of the project_alpha core for the Dart package pa_core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "pa_frb"
# cdylib: Android, Linux, Windows; staticlib: Apple; lib: Rust tests.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge.workspace = true
pa-catalog = { path = "../pa-catalog" }
pa-ffi = { path = "../pa-ffi" }
pa-recognition = { path = "../pa-recognition" }
pa-secrets = { path = "../pa-secrets" }
pa-sources = { path = "../pa-sources" }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# Emitted by the flutter_rust_bridge macros.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
