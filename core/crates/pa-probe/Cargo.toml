# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-probe"
version = "0.1.0"
description = "Container analysis over libavformat (LGPL FFmpeg loaded at run time) through pa-vfs: duration, codecs, HDR and Dolby Vision, audio, subtitles, chapters, tags, attachments (LIB-006)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# FFmpeg is LGPL: it is never linked at build time. `libloading` opens the
# shared libraries built by tools/ffmpeg at run time (ADR-NNNN), so the
# workspace builds and tests without them and they stay replaceable files.
[dependencies]
libloading.workspace = true
pa-library = { path = "../pa-library" }
pa-player-io = { path = "../pa-player-io" }
pa-vfs = { path = "../pa-vfs" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
toml.workspace = true
