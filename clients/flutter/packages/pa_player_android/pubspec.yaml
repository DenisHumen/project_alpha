# SPDX-License-Identifier: MPL-2.0
name: pa_player_android
description: "Android player: Media3/ExoPlayer engine of the core PlayerEngine contract in a native Activity with a SurfaceView and a Flutter OSD on top (PLAY-AND-002, ADR-0008)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.projectalpha.player.flutter
        pluginClass: PaPlayerAndroidPlugin
