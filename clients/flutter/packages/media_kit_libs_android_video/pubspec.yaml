# SPDX-License-Identifier: MPL-2.0
#
# Local replacement for media_kit_libs_android_video 1.3.8 (PLAY-013). The app
# uses it through dependency_overrides: same plugin class and Java glue as
# upstream (MIT, see LICENSE), but jniLibs come from our LGPL-2.1 libmpv build
# (tools/mpv) instead of prebuilt jars downloaded at build time.
name: media_kit_libs_android_video
description: "Kinolune: media_kit Android native libraries from our own LGPL-2.1 libmpv build (tools/mpv)."
version: 1.3.8
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.alexmercerind.media_kit_libs_android_video
        pluginClass: MediaKitLibsAndroidVideoPlugin
