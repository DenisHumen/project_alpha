# SPDX-License-Identifier: MPL-2.0
name: pa_platform_secrets
description: "Platform secret store of the Rust core on mobile (CORE-015): Android Keystore + AES-GCM behind a platform channel, opened in pa_core through flutter_rust_bridge."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  pa_core:
    path: ../pa_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.projectalpha.secrets.flutter
        pluginClass: PaPlatformSecretsPlugin
