# SPDX-License-Identifier: MPL-2.0
name: pa_player_example
description: "Manual test app for pa_player: plays local files passed as arguments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  pa_player:
    path: ..

# Same libmpv as the app (PLAY-013): fill its jniLibs with tools/mpv/bundle.sh.
dependency_overrides:
  media_kit_libs_android_video:
    path: ../../media_kit_libs_android_video

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
