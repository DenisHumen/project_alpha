# SPDX-License-Identifier: MPL-2.0
# gen-l10n (UI-020). Strings live in lib/l10n/app_<locale>.arb; English is the
# template. Keys carry a feature prefix (nav, home, library, settings…), new
# keys are only appended (ROADMAP §0.5). test/l10n_test.dart fails CI on a
# missing translation or a stale pseudo-locale file.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
format: true
header: |-
  // SPDX-License-Identifier: MPL-2.0
  // Generated by `flutter gen-l10n` from lib/l10n/*.arb; do not edit.
