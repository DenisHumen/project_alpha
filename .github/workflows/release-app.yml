# SPDX-License-Identifier: MPL-2.0
#
# Release of the Flutter app (R01-REL): Linux x86_64 (tar.gz + AppImage) and
# Android APKs (arm64-v8a, armeabi-v7a, x86_64 + universal), SHA256SUMS,
# licence notices and LGPL corresponding sources, published as a GitHub Release.
# Both platforms ship our LGPL-2.1 libmpv + FFmpeg (tools/mpv, PLAY-013), built
# in the same run by libmpv.yml.
#
#   - push of a tag `app-v<semver>`     -> build, then publish the release;
#   - workflow_dispatch with `version`  -> dry run: same build, everything is
#     uploaded as the workflow artifact `release-<version>`, nothing is published.
#
# Only the `publish` job gets `contents: write`. Android signing uses the
# repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD when present; otherwise the
# APKs keep the debug signature and the release is labelled so.
# Owner steps: packaging/app/README.md.

name: Release app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run (semver, e.g. 0.1.0-rc.1). Nothing is published."
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with flutter.yml.
  FLUTTER_VERSION: "3.50.0"
  APP_DIR: clients/flutter/app

jobs:
  meta:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Only a tag publishes; anything else (workflow_dispatch) is a dry run.
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == app-v* ]]; then
            tag="$REF_NAME"; version="${REF_NAME#app-v}"; dry_run=false
          else
            version="${INPUT_VERSION:-0.0.0-dryrun}"; tag="app-v$version"; dry_run=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a semver version (x.y.z or x.y.z-pre)"
            exit 1
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          if [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "::error::$APP_DIR/pubspec.yaml not found: the app is not on this ref"
            exit 1
          fi
          {
            echo "version=$version"; echo "tag=$tag"
            echo "dry_run=$dry_run"; echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### Kinolune $version (dry run: $dry_run, prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  libmpv:
    name: libmpv
    needs: meta
    uses: ./.github/workflows/libmpv.yml
    with:
      release: true

  linux:
    name: Linux x86_64
    needs: [meta, libmpv]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            patchelf libva2 libva-drm2 libdrm2 libegl1 libpulse0 libasound2t64
          # No libmpv-dev: the app links our libmpv (tools/mpv) through its .pc files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libmpv-linux-x86_64
          path: ${{ runner.temp }}/libmpv-linux-x86_64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # No cache in the release pipeline: every release builds from scratch.
          cache: false
      - name: flutter build linux
        working-directory: ${{ env.APP_DIR }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # media_kit_video finds libmpv with pkg-config: ours, never the system one.
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libmpv-linux-x86_64/lib/pkgconfig"
          pkg-config --modversion mpv
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          flutter build linux --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Package tar.gz and AppImage (with our libmpv)
        env:
          PA_LIBMPV_DIR: ${{ runner.temp }}/libmpv-linux-x86_64
        run: packaging/app/linux/package.sh "$APP_DIR/build/linux/x64/release/bundle" "$VERSION" dist
      - name: Smoke-test the bundle links
        run: |
          tar -xzf "dist/kinolune-$VERSION-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/kinolune-$VERSION-linux-x86_64"
          exe=$(find "$dir" -maxdepth 1 -type f -perm -u+x | head -n1)
          if ldd "$exe" "$dir"/lib/*.so* | grep 'not found'; then
            echo "::error::unresolved shared libraries"; exit 1
          fi
          # The plugin must resolve libmpv from the bundle (RUNPATH=$ORIGIN).
          ldd "$dir/lib/libmedia_kit_video_plugin.so" | grep -F "libmpv.so.2 => $dir/lib/libmpv.so.2" \
            || { echo "::error::media_kit_video does not load the bundled libmpv"; exit 1; }
          [ -f "$dir/licenses/libmpv/BUILDINFO.txt" ] || { echo "::error::libmpv licences missing"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APKs
    needs: [meta, libmpv]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
      libmpv: ${{ steps.licences.outputs.libmpv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fetch design fonts (pinned SHA-256)
        run: |
          # pa_design ships Inter outside git; the app and package need it to build.
          if [ -f design/scripts/fonts-fetch.mjs ]; then node design/scripts/fonts-fetch.mjs; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libmpv-android-*
          path: ${{ runner.temp }}/libmpv
      - name: Our libmpv into jniLibs (PLAY-013)
        run: |
          # The app overrides media_kit_libs_android_video with
          # clients/flutter/packages/media_kit_libs_android_video, whose release
          # build fails without this set; bundle.sh checks it first.
          tools/mpv/bundle.sh android \
            clients/flutter/packages/media_kit_libs_android_video/android/src/main/jniLibs \
            "$RUNNER_TEMP"/libmpv/libmpv-android-{arm64-v8a,armeabi-v7a,x86_64}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: flutter build apk (split per ABI + universal)
        working-directory: ${{ env.APP_DIR }}
        env:
          # Monotonic versionCode; split APKs get +1000*ABI on top (Flutter).
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          common=(--release --target-platform "android-arm,android-arm64,android-x64"
                  --build-name "$VERSION" --build-number "$BUILD_NUMBER")
          out="$GITHUB_WORKSPACE/dist"
          mkdir -p "$out"
          apks=build/app/outputs/flutter-apk
          flutter build apk "${common[@]}" --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$apks/app-$abi-release.apk" "$out/kinolune-$VERSION-android-$abi.apk"
          done
          flutter build apk "${common[@]}"
          cp "$apks/app-release.apk" "$out/kinolune-$VERSION-android-universal.apk"
          ls -l "$out"
      - name: Sign APKs
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mode=$(packaging/app/android/sign.sh dist/*.apk)
          echo "signing=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = debug ]; then
            echo "::warning::No release keystore in secrets: APKs are debug-signed"
          fi
      - name: Licence gate for native libraries
        id: licences
        run: |
          mkdir -p notes
          packaging/app/android/check-native-licences.sh notes/native-licences.md dist/*.apk > "$RUNNER_TEMP/gate.out"
          tail -n1 "$RUNNER_TEMP/gate.out" >> "$GITHUB_OUTPUT"
          cat notes/native-licences.md >> "$GITHUB_STEP_SUMMARY"
          # Every APK and ABI must carry our libmpv set, or nothing plays.
          if [ "$(tail -n1 "$RUNNER_TEMP/gate.out")" != libmpv=yes ]; then
            echo "::error::an APK or ABI lacks the tools/mpv libmpv set"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            dist/
            notes/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release
    needs: [meta, libmpv, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      DRY_RUN: ${{ needs.meta.outputs.dry_run }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect assets, licences and checksums
        run: |
          mkdir -p release/assets
          cp artifacts/linux/* release/assets/
          cp artifacts/android/dist/* release/assets/
          lic="kinolune-$VERSION-licenses"
          mkdir -p "$RUNNER_TEMP/$lic/licenses"
          cp LICENSE packaging/app/THIRD-PARTY-NOTICES.md "$RUNNER_TEMP/$lic/"
          packaging/app/fetch-licences.sh "$RUNNER_TEMP/$lic/licenses"
          # Corresponding sources of the libmpv/FFmpeg shipped in the APKs and
          # the Linux bundle; checked against their BUILDINFO.txt.
          libmpv=(artifacts/libmpv-android-{arm64-v8a,armeabi-v7a,x86_64} artifacts/libmpv-linux-x86_64)
          PA_LIBMPV_SOURCES="$(ls artifacts/libmpv-sources/project_alpha-libmpv-sources-*.tar.xz)" \
            packaging/app/lgpl-sources.sh "release/assets/kinolune-$VERSION-libmpv-sources.tar.xz" \
            release/libmpv.md "${libmpv[@]}"
          cp release/libmpv.md "$RUNNER_TEMP/$lic/LIBMPV-COMPONENTS.md"
          mkdir -p "$RUNNER_TEMP/$lic/licenses/libmpv"
          for d in "${libmpv[@]}"; do cp "$d"/share/licenses/* "$RUNNER_TEMP/$lic/licenses/libmpv/"; done
          tar --sort=name --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP" \
            -czf "release/assets/$lic.tar.gz" "$lic"
          (cd release/assets && sha256sum -- * > SHA256SUMS)
          cat release/assets/SHA256SUMS
      - name: Release notes
        run: |
          notes=release/notes.md
          message=""
          if [ "$DRY_RUN" = false ]; then
            git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              message=$(git tag -l --format='%(contents:body)' "$TAG")
              subject=$(git tag -l --format='%(contents:subject)' "$TAG")
              message=$(printf '%s\n\n%s\n' "$subject" "$message" | sed '/-----BEGIN/,$d')
            fi
          fi
          {
            if [ "$SIGNING" = debug ]; then
              echo "> [!WARNING]"
              echo "> **Unsigned / debug-signed Android build.** The APKs are signed with a throw-away CI debug key:"
              echo "> later releases cannot be installed over them; uninstall first."
              echo
            fi
            if [ -n "$message" ]; then printf '%s\n\n' "$message"; else echo "Kinolune $VERSION."; echo; fi
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux x86_64 (AppImage) | \`kinolune-$VERSION-x86_64.AppImage\` |"
            echo "| Linux x86_64 (archive) | \`kinolune-$VERSION-linux-x86_64.tar.gz\` |"
            echo "| Android, most phones and TVs (64-bit ARM) | \`kinolune-$VERSION-android-arm64-v8a.apk\` |"
            echo "| Android, older 32-bit ARM devices | \`kinolune-$VERSION-android-armeabi-v7a.apk\` |"
            echo "| Android x86_64 (emulators, Chromebooks) | \`kinolune-$VERSION-android-x86_64.apk\` |"
            echo "| Android, any device (larger) | \`kinolune-$VERSION-android-universal.apk\` |"
            echo
            echo "Linux needs glibc 2.39+ (Ubuntu 24.04 or newer), GTK 3, PulseAudio or PipeWire, libva and EGL;"
            echo "libmpv and FFmpeg are included."
            echo
            echo "Android signing: **$SIGNING**. Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "## Licences"
            echo
            echo "Kinolune is MPL-2.0. Third-party notices and licence texts: \`kinolune-$VERSION-licenses.tar.gz\`."
            echo
            cat release/libmpv.md
            echo
            echo "<details><summary>Native libraries licence gate</summary>"
            echo
            cat artifacts/android/notes/native-licences.md
            echo
            echo "</details>"
          } > "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [meta, android, assemble]
    if: needs.meta.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      SIGNING: ${{ needs.android.outputs.signing }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Kinolune $VERSION"
          [ "$SIGNING" = debug ] && title="$title (Android debug-signed)"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$title" --notes-file release/notes.md "${flags[@]}" release/assets/*
