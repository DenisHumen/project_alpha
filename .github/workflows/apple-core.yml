# SPDX-License-Identifier: MPL-2.0
# CORE-003: Rust core as PACoreFFI.xcframework (iOS, iOS Simulator, tvOS,
# tvOS Simulator, macOS universal) + SwiftPM package PACore; XCTest calls
# coreVersion() on macOS and on iOS and tvOS simulators.
# TV-001: the tvOS app skeleton (job `tvapp`).
# PLAY-APL-001: AlphaPlayerKit (MPVKit, LGPL only) on top of that xcframework:
# PlayerEngine contract suite and QA-002 MKVs on iOS and tvOS simulators (job `player`).
# May be folded into the Apple CI job by CI-007.
name: Apple core (PACore)

on:
  workflow_dispatch:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "core/crates/**"
      - "tools/bindings/**"
      - "clients/apple/TVApp/**"
      - "clients/apple/AlphaPlayerKit/**"
      - "tools/qa/media/**"
      - "design/icons/generated/apple/**"
      - "design/tokens/generated/apple/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/apple-core.yml"

permissions:
  contents: read

concurrency:
  group: apple-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcframework:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: xcframework and XCTest
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install && rustup show active-toolchain
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PACoreFFI.xcframework (all slices) and Swift bindings
        run: tools/bindings/build-xcframework.sh
      - name: Check xcframework slices
        run: |
          plist=tools/bindings/PACore/PACoreFFI.xcframework/Info.plist
          plutil -p "$plist"
          for id in ios-arm64 ios-arm64_x86_64-simulator tvos-arm64 tvos-arm64-simulator macos-arm64_x86_64; do
            plutil -p "$plist" | grep -q "\"$id\"" || { echo "::error::missing slice $id"; exit 1; }
          done
          find tools/bindings/PACore/PACoreFFI.xcframework -name '*.a' -exec lipo -info {} \;
      - name: XCTest on macOS
        run: tools/bindings/test-pacore.sh macos
      - name: XCTest on iOS Simulator
        run: tools/bindings/test-pacore.sh ios
      - name: XCTest on tvOS Simulator
        run: tools/bindings/test-pacore.sh tvos
      - name: Pack xcframework
        run: cd tools/bindings/PACore && ditto -c -k --keepParent PACoreFFI.xcframework "$RUNNER_TEMP/PACoreFFI.xcframework.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PACore
          path: |
            ${{ runner.temp }}/PACoreFFI.xcframework.zip
            tools/bindings/PACore/Sources/PACore/PACore.swift
          retention-days: 7
          if-no-files-found: error

  # TV-001: tvOS app (clients/apple/TVApp). Builds its own tvOS-simulator slice
  # (debug) to run in parallel with the xcframework job; XcodeGen generates the
  # Xcode project (ADR-NNNN); unit and UI tests; Home screenshot as an artifact.
  tvapp:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: TVApp build, tests and screenshot
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DERIVED_DATA: ${{ github.workspace }}/clients/apple/TVApp/DerivedData
      XCODEGEN_VERSION: "2.45.4"
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install && rustup show active-toolchain
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PACoreFFI.xcframework (tvOS simulator slice)
        run: tools/bindings/build-xcframework.sh --debug tvos-sim
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate TVApp.xcodeproj
        working-directory: clients/apple/TVApp
        run: xcodegen --version && xcodegen generate
      - name: Pick tvOS simulator
        run: |
          # Newest tvOS runtime, first available device on it (as in test-pacore.sh).
          read -r udid name < <(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.tvOS-"))
              | select(.value | length > 0)]
            | sort_by(.key | capture("-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | last | .value[0] | "\(.udid) \(.name)"')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "::error::no tvOS simulator"; exit 1; }
          echo "tvOS simulator: $name ($udid)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Unit and UI tests (xcodebuild test)
        run: |
          set -o pipefail
          xcodebuild test \
            -project clients/apple/TVApp/TVApp.xcodeproj -scheme TVApp \
            -destination "id=$SIM_UDID" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/TVApp.xcresult" \
            -skipPackagePluginValidation
      - name: Screenshot of Home from the simulator
        if: ${{ !cancelled() }}
        run: |
          app="$DERIVED_DATA/Build/Products/Debug-appletvsimulator/TVApp.app"
          [ -d "$app" ] || { echo "::warning::no TVApp.app, skipping screenshot"; exit 0; }
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl terminate "$SIM_UDID" app.kinolune.tv 2>/dev/null || true
          xcrun simctl launch "$SIM_UDID" app.kinolune.tv
          sleep 10
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/screenshots/tvos-home.png"
      - name: Pack test results
        if: ${{ !cancelled() }}
        run: |
          [ -d "$RUNNER_TEMP/TVApp.xcresult" ] || exit 0
          cd "$RUNNER_TEMP" && ditto -c -k --keepParent TVApp.xcresult TVApp.xcresult.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tvos-home-screenshot
          path: ${{ runner.temp }}/screenshots/tvos-home.png
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: TVApp-xcresult
          path: ${{ runner.temp }}/TVApp.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore

  player:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AlphaPlayerKit (MPVKit) on iOS and tvOS simulators
    needs: xcframework
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PKG: clients/apple/AlphaPlayerKit
      # Media tests must run here: a missing fixture directory fails instead of skipping.
      PA_REQUIRE_MEDIA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence gate on the manifest (and a GPL canary that must fail)
        run: |
          "$PKG/scripts/check-license.sh" manifest "$PKG/Package.swift"
          canary="$RUNNER_TEMP/Package.swift"
          sed 's/name: "MPVKit", package/name: "MPVKit-GPL", package/' "$PKG/Package.swift" > "$canary"
          if "$PKG/scripts/check-license.sh" manifest "$canary"; then echo "::error::GPL canary passed"; exit 1; fi
      - name: Store profile rejects MPVKit (LGPL-3.0 FFmpeg) — this is a non-release build
        run: |
          # Release builds are LGPL-2.1 only (ADR-0005). MPVKit's FFmpeg is
          # --enable-version3, so the store gate must fail until PLAY-APL-013.
          if "$PKG/scripts/check-license.sh" manifest --store "$PKG/Package.swift"; then
            echo "::error::store licence gate accepted MPVKit"; exit 1
          fi
          echo "::notice::AlphaPlayerKit uses MPVKit (LGPL-3.0 FFmpeg): development/CI build only, not for the App Store (PLAY-APL-013)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PACore
          path: ${{ runner.temp }}/pacore
      - name: Install PACoreFFI.xcframework and PACore.swift from the xcframework job
        run: |
          zip="$(find "$RUNNER_TEMP/pacore" -name PACoreFFI.xcframework.zip | head -1)"
          swift="$(find "$RUNNER_TEMP/pacore" -name PACore.swift | head -1)"
          ditto -x -k "$zip" tools/bindings/PACore
          cp "$swift" tools/bindings/PACore/Sources/PACore/PACore.swift
          ls tools/bindings/PACore
      - name: FFmpeg for test media (generated here, never shipped)
        run: brew install ffmpeg && ffmpeg -hide_banner -version | head -1
      - name: Contract fixtures and QA-002 MKVs
        run: |
          "$PKG/scripts/make-fixtures.sh" "$RUNNER_TEMP/fixtures"
          python3 "$PKG/scripts/make-qa-media.py" "$RUNNER_TEMP/qa-media"
      - name: Cache MPVKit binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: mpvkit-${{ hashFiles('clients/apple/AlphaPlayerKit/Package.swift') }}
      - name: XCTest on iOS Simulator (+ licence check of the linked binary)
        run: PA_SPM_CACHE="$RUNNER_TEMP/spm" PA_DERIVED_DATA="$RUNNER_TEMP/dd-ios" "$PKG/scripts/test.sh" ios "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/qa-media"
      - name: XCTest on tvOS Simulator (+ licence check of the linked binary)
        run: PA_SPM_CACHE="$RUNNER_TEMP/spm" PA_DERIVED_DATA="$RUNNER_TEMP/dd-tvos" "$PKG/scripts/test.sh" tvos "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/qa-media"
