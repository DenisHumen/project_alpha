# SPDX-License-Identifier: MPL-2.0
# TV-001: tvOS app (clients/apple/TVApp): build PACoreFFI.xcframework (tvOS
# simulator slice), generate the Xcode project with XcodeGen, run unit and UI
# tests on a tvOS simulator and upload a screenshot of the Home screen.
# May be folded into the Apple CI job by CI-007.
name: Apple tvOS app

on:
  workflow_dispatch:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "clients/apple/TVApp/**"
      - "design/icons/generated/apple/**"
      - "core/crates/**"
      - "tools/bindings/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/apple-tvos.yml"

permissions:
  contents: read

concurrency:
  group: apple-tvos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tvapp:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: TVApp build, tests and screenshot
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DERIVED_DATA: ${{ github.workspace }}/clients/apple/TVApp/DerivedData
      XCODEGEN_VERSION: "2.45.4"
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install && rustup show active-toolchain
          xcodebuild -version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build PACoreFFI.xcframework (tvOS simulator slice)
        run: tools/bindings/build-xcframework.sh --debug tvos-sim
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate TVApp.xcodeproj
        working-directory: clients/apple/TVApp
        run: xcodegen --version && xcodegen generate
      - name: Pick tvOS simulator
        run: |
          # Newest tvOS runtime, first available device on it (as in test-pacore.sh).
          read -r udid name < <(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.tvOS-"))
              | select(.value | length > 0)]
            | sort_by(.key | capture("-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | last | .value[0] | "\(.udid) \(.name)"')
          [ -n "$udid" ] && [ "$udid" != null ] || { echo "::error::no tvOS simulator"; exit 1; }
          echo "tvOS simulator: $name ($udid)"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Unit and UI tests (xcodebuild test)
        run: |
          set -o pipefail
          xcodebuild test \
            -project clients/apple/TVApp/TVApp.xcodeproj -scheme TVApp \
            -destination "id=$SIM_UDID" -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/TVApp.xcresult" \
            -skipPackagePluginValidation
      - name: Screenshot of Home from the simulator
        if: ${{ !cancelled() }}
        run: |
          app="$DERIVED_DATA/Build/Products/Debug-appletvsimulator/TVApp.app"
          [ -d "$app" ] || { echo "::warning::no TVApp.app, skipping screenshot"; exit 0; }
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl terminate "$SIM_UDID" app.kinolune.tv 2>/dev/null || true
          xcrun simctl launch "$SIM_UDID" app.kinolune.tv
          sleep 10
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl io "$SIM_UDID" screenshot "$RUNNER_TEMP/screenshots/tvos-home.png"
      - name: Pack test results
        if: ${{ !cancelled() }}
        run: |
          [ -d "$RUNNER_TEMP/TVApp.xcresult" ] || exit 0
          cd "$RUNNER_TEMP" && ditto -c -k --keepParent TVApp.xcresult TVApp.xcresult.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: tvos-home-screenshot
          path: ${{ runner.temp }}/screenshots/tvos-home.png
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: TVApp-xcresult
          path: ${{ runner.temp }}/TVApp.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore
