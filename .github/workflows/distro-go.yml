# SPDX-License-Identifier: MPL-2.0
# Go checks for the NAS OS installer (DIST-004+): gofmt, vet, unit tests on
# recorded lsblk/udev fixtures. Nothing here touches real disks.

name: Distro Go

on:
  pull_request:
    paths:
      - "distro/installer/**"
      - ".github/workflows/distro-go.yml"
  push:
    branches: [main]
    paths:
      - "distro/installer/**"

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distro/installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distro/installer/go.mod
          cache-dependency-path: distro/installer/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
