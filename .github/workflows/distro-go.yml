# SPDX-License-Identifier: MPL-2.0
# Go checks for the NAS OS installer (DIST-004+): gofmt, vet, unit tests on
# recorded lsblk/udev fixtures. Nothing here touches real disks.

name: Distro Go

on:
  workflow_dispatch:
  pull_request:
    # CI on PRs runs once when the PR is opened or marked ready (not on every
    # push to a draft). Re-run manually: gh workflow run <file> --ref <branch>.
    types: [opened, reopened, ready_for_review]
    paths:
      - "distro/installer/**"
      - ".github/workflows/distro-go.yml"
  push:
    branches: [main]
    paths:
      - "distro/installer/**"

permissions:
  contents: read

jobs:
  installer:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: distro/installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: distro/installer/go.mod
          cache-dependency-path: distro/installer/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
