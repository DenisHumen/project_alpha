name: Предложение / Feature request
description: Идея новой функции (обсуждать и голосовать удобнее в Discussions → Ideas)
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решает / Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предложение / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы / Alternatives considered
  - type: input
    id: roadmap
    attributes:
      label: Связанная задача ROADMAP / Related ROADMAP task
      placeholder: "UI-012"
