# SPDX-License-Identifier: MPL-2.0
#
# Labels as code (REPO-006). Synced to GitHub by .github/workflows/labels.yml
# on every push to main that changes this file. Add or rename labels here,
# not in the GitHub UI. To rename, set `from_name` to the old name.
# Labels that exist on GitHub but are missing here are kept (skip-delete).

# --- Type and triage ---
- name: bug
  color: "d73a4a"
  description: "Что-то работает не так / Something isn't working"
- name: enhancement
  color: "a2eeef"
  description: "Новая функция или улучшение / New feature or request"
- name: playback
  color: "e99695"
  description: "Проблема воспроизведения / Playback issue"
- name: recognition
  color: "c5def5"
  description: "Неверное распознавание медиа / Wrong media match"
- name: documentation
  color: "0075ca"
  description: "Документация / Documentation"
- name: question
  color: "d876e3"
  description: "Вопрос / Further information is requested"
- name: triage
  color: "fbca04"
  description: "Ждёт разбора мейнтейнером / Needs maintainer triage"
- name: security
  color: "b60205"
  description: "Безопасность (уязвимости — только приватно, см. SECURITY.md)"
- name: conduct
  color: "5319e7"
  description: "Кодекс поведения / Code of conduct"
- name: dependencies
  color: "0366d6"
  description: "Обновление зависимостей / Dependency updates"
- name: duplicate
  color: "cfd3d7"
  description: "Дубликат / This issue or pull request already exists"
- name: invalid
  color: "e4e669"
  description: "Некорректно / This doesn't seem right"
- name: wontfix
  color: "ffffff"
  description: "Не будет сделано / This will not be worked on"
- name: accessibility
  color: "7057ff"
  description: "Доступность / Accessibility"
- name: good first issue
  color: "7057ff"
  description: "Подходит для первого вклада / Good for newcomers"
- name: help wanted
  color: "008672"
  description: "Нужна помощь / Extra attention is needed"
- name: owner
  color: "000000"
  description: "Только владелец: аккаунты, деньги, юр. вопросы, публикация"
- name: blocked
  color: "b60205"
  description: "Ждёт решения владельца (DEC-00N) или зависимости"

