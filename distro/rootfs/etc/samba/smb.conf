# Minimal Samba config for the phase-0 NAS OS image (DIST-001).
# Later generated by alpha-admin into /etc/samba/smb.conf.d/ (05 §5.2).
[global]
    workgroup = WORKGROUP
    server string = project_alpha NAS
    server min protocol = SMB3
    security = user
    map to guest = Bad User
    passdb backend = tdbsam
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba

[Media]
    comment = Media library
    path = /var/srv/media
    browseable = yes
    read only = yes
    guest ok = yes
