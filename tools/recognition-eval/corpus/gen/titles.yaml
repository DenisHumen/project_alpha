# Anime TV/OVA/ONA franchises. Each franchise is a list of AniDB entries in
# broadcast order. Optional per entry:
#   tmdb_season   TMDB season that holds the entry (maintainer knowledge,
#                 marked as such in record notes; records stay draft)
#   tmdb_offset   episodes of that TMDB season that precede this entry
# Per franchise:
#   abs           tvdb_absolute = regular episodes of previous entries + n
#   names         filename titles: romaji, en, ru (as written by releasers)
anime:
  - key: one-piece
    names: {romaji: "One Piece", ru: "Ван-Пис"}
    abs: true
    long: true
    entries: [{aid: 69}]
  - key: naruto
    names: {romaji: "Naruto", ru: "Наруто"}
    abs: true
    long: true
    entries: [{aid: 239}]
  - key: naruto-shippuuden
    names: {romaji: "Naruto Shippuuden", en: "Naruto Shippuden", ru: "Наруто: Ураганные хроники"}
    abs: true
    long: true
    entries: [{aid: 4880}]
  - key: bleach
    names: {romaji: "Bleach", ru: "Блич"}
    long: true
    abs: true
    entries:
      - {aid: 2369}
      - {aid: 15449, names: {romaji: "Bleach - Sennen Kessen-hen", en: "Bleach - Thousand-Year Blood War"}}
