# SPDX-License-Identifier: MPL-2.0
#
# Hand-curated title list for recognition corpus v0 (META-002).
#
# This file is written by hand. It names real, publicly known works only; it
# contains no filenames from other projects' test suites and nothing scraped
# from trackers. External ids are NOT typed in here for movies and shows: they
# are resolved and cross-checked by `resolve.py` (Wikidata, CC0; TVmaze;
# anime-offline-database, ODbL) into `facts.json`. Anime entries are pinned by
# AniDB id (looked up in anime-offline-database) because AniDB is canonical.
#
# Keys:
#   t      title used to look the work up (English or original)
#   y      premiere year (used to disambiguate and to cross-check)
#   tags   generator hints: digits (A14), ru (Russian/Soviet work),
#          old (DVD/XviD era: cd1/cd2, VIDEO_TS), remake:<key> (A8 group)
#   wd     Wikidata QID override when the search picks the wrong item
#   ru     Russian title override (otherwise the Wikidata ru label)

