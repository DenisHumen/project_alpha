# SPDX-License-Identifier: MPL-2.0
#
# gitleaks configuration (secrets policy, REPO-009, docs/dev/secrets.md).
# Used by the pre-commit hook (.pre-commit-config.yaml) and by CI
# (.github/workflows/hygiene.yml). Default rules plus project allowlist.

title = "project_alpha gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Licence texts, lockfiles and placeholder templates contain no secrets"
paths = [
  '''^LICENSES/''',
  '''^LICENSE$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)pubspec\.lock$''',
]

[[allowlists]]
description = "Documented placeholders, e.g. PA_TMDB_API_KEY=changeme"
regexTarget = "line"
regexes = [
  '''(?i)=\s*(changeme|your[-_a-z]*|<[^>]+>|xxx+)\s*$''',
]

[[allowlists]]
description = "Recognition corpus title list: franchise slugs (`- key: fruits-basket-2001`) look like generic API keys"
paths = ['''^tools/recognition-eval/corpus/gen/titles\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*- key: [a-z0-9-]+$''']
condition = "AND"
