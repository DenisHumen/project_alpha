# SPDX-License-Identifier: MPL-2.0
#
# Манифест тестовых медиа (QA-002). Описывает КАЖДЫЙ файл набора: путь,
# происхождение, лицензию, назначение и ожидаемые свойства (их проверяет
# `tools/qa/media/verify.py` через ffprobe). Формат — tests/media/README.md.
#
# Синтетические файлы (`synthetic/`) создаёт `tools/qa/media/generate.py`
# (поле `recipe`, по умолчанию = `id`); в git они не хранятся.
# Внешние файлы (`external/`) скачивает `tools/qa/media/fetch.py` по `url`
# и сверяет `size` и `sha256`.

schema = 1

[sources.synthetic]
licence = "CC0-1.0"
attribution = "project_alpha contributors; сгенерировано tools/qa/media/generate.py из тестовых источников FFmpeg"

[sources.blender]
licence = "CC-BY-3.0"
attribution = "(c) copyright Blender Foundation | www.blender.org"

[sources.blender-ost]
licence = "CC-BY-ND-3.0"
attribution = "(C) Joram Letwory - www.tearsofsteel.org"

# =========================================================================
# Контейнеры и кодеки: 640x360, 3 с, тестовая таблица + тон (каналы: 300, 400 Гц)
# =========================================================================

[[file]]
id = "v-h264-aac-mp4"
path = "synthetic/video/h264-aac.mp4"
what = "Базовый файл: H.264 High + AAC LC, moov в начале (faststart)"
used_by = ["PLAY-DSK-002", "PLAY-AND-002", "LIB-006", "QA-003"]
expect = { format = "mov,mp4,m4a,3gp,3g2,mj2", duration = 3.0 }
streams = [
  { type = "video", codec = "h264", profile = "High", width = 640, height = 360, pix_fmt = "yuv420p", fps = "24/1" },
  { type = "audio", codec = "aac", channels = 2, sample_rate = 48000 },
]

[[file]]
id = "v-h264-aac-moov-end"
path = "synthetic/video/h264-aac-moov-at-end.mp4"
what = "То же, но moov в конце файла: нужен seek в конец до старта (SMB/WebDAV, ByteSource)"
