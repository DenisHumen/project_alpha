# SPDX-License-Identifier: MPL-2.0
[package]
name = "pa-server"
version = "0.1.0"
description = "Kinolune media server (mode B): axum HTTP on top of the core crates"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Binary name follows the NAS OS layout (ADR-0010: /usr/lib/alpha-media).
[[bin]]
name = "alpha-media"
path = "src/main.rs"

# TLS is rustls with the ring provider only (openssl is banned by deny.toml);
# rcgen makes the self-signed certificate (SRV-004, ADR-NNNN).
[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
pa-discovery = { path = "../core/crates/pa-discovery", features = ["mdns", "tls"] }
pa-library = { path = "../core/crates/pa-library" }
pa-model = { path = "../core/crates/pa-model" }
pa-pairing = { path = "../core/crates/pa-pairing" }
pa-runtime = { path = "../core/crates/pa-runtime" }
pa-secrets = { path = "../core/crates/pa-secrets" }
pa-sync = { path = "../core/crates/pa-sync" }
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "json", "std"] }
uuid.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread"] }
tokio-tungstenite.workspace = true
